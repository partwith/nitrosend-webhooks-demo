# fly.toml app configuration file generated for nitrosend-webhooks-demo on 2026-08-12T23:08:22+10:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nitrosend-webhooks-demo'
primary_region = 'syd'
console_command = '/rails/bin/rails console'

[build]
[deploy]
  release_command = 'bin/rails db:prepare'

[env]
  RAILS_LOG_TO_STDOUT = 'true'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'off'
  min_machines_running = 1

  [[http_service.checks]]
    interval = '10s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/up'
    protocol = 'http'
    tls_skip_verify = false

    [http_service.checks.headers]
      X-Forwarded-Proto = 'https'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
